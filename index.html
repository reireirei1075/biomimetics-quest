function stats(){app.innerHTML=header()+`<section class="panel"><h2>学習記録</h2>${[2,3,4].map(p=>{let a=M.filter(q=>q.part===p);return `<p>Part ${p} 重要表現 ${mastered(a)}/${a.length}</p>${bar(mastered(a),a.length)}`}).join('')}${rooms.map((r,i)=>{let a=L.filter(q=>q.room===i);return `<p>${r} ${mastered(a)}/${a.length}</p>${bar(mastered(a),a.length)}`}).join('')}<p>苦手問題 ${Object.keys(store.wrong).length}問</p><p>最高賞金 ${yen(store.best)}</p></section>`}
function cards(){app.innerHTML=header()+`<section class="panel"><h2>重要表現 暗記モード</h2><p>日本語と空欄を見て、答えを思い出してから開こう。</p>${M.map(q=>`<details><summary>Part ${q.part}　${blanks(q)}<br>${esc(q.j)}</summary><p class="mint">${esc(q.a)}</p><p>${esc(q.e)}</p></details><hr>`).join('')}</section>`}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled||locked)return;let a=b.dataset.action;if(a==='home')home();else if(a==='logout'){locked=true;try{sessionStorage.removeItem(key)}catch(e){}login()}else if(a==='million'){let pool=shuffle(M),sort=pool.filter(q=>q.kind==='sort').slice(0,5),input=pool.filter(q=>q.kind==='input').slice(0,10);start('M',[...input.slice(0,5),...shuffle([...input.slice(5),...sort])])}else if(a==='labs')labs();else if(a.startsWith('room')){let i=+a.slice(4);start('L',shuffle(L.filter(q=>q.room===i)),i)}else if(a==='weakM'||a==='weakL'){let mode=a.slice(-1);start(mode,shuffle((mode==='M'?M:L).filter(q=>store.wrong[q.id])).slice(0,mode==='M'?15:100))}else if(a==='resume'){run=store.session;if(run)render()}else if(a==='stats')stats();else if(a==='cards')cards();else if(a==='nobel')nobel();else if(a==='awardNext')awardNext();else if(/^award[0-4]$/.test(a))celebrate(+a.slice(5));else if(run){if(a==='next'){next();window.scrollTo(0,0);}else if(run.done)return;else if(a.startsWith('answer'))answer(run.options[+a.slice(6)]);else if(a.startsWith('token')){let i=+a.slice(5);if(!run.chosen.includes(i))run.chosen.push(i);persist();render()}else if(a.startsWith('remove')){run.chosen=run.chosen.filter(i=>i!==+a.slice(6));persist();render()}else if(a.startsWith('pick')){let i=+a.slice(4);run.chosen=run.chosen.includes(i)?run.chosen.filter(x=>x!==i):[...run.chosen,i];persist();render()}else if(a==='submit'){if(run.kind==='multi'){if(run.chosen.length)answer(run.chosen.map(i=>run.options[i]).sort().join(' / '))}else if(run.chosen.length===run.tokens.length)answer(run.chosen.map(i=>run.tokens[i].w).join(run.kind==='sequence'?' → ':' '))}else if(a==='first'||a==='bank'||a==='fifty'||a==='jp'||a==='structure'){let q=qnow();if((a==='first'||a==='bank')&&run.kind!=='input')return;if(a==='structure'&&run.kind!=='sort')return;run.hints++;if(a==='structure')run.life.structure=true;if(a==='first')run.life.first=true;if(a==='jp')run.life.jp=true;if(a==='bank')run.life.bank=shuffle(q.a.replace(/\//g,'').split(/\s+/).filter(Boolean));if(a==='fifty'){run.life.fifty=true;run.hidden=shuffle(run.options.map((x,i)=>i).filter(i=>run.options[i]!==q.a)).slice(0,2)}persist();render()}}});locked?login():home();
</script></body></html>
